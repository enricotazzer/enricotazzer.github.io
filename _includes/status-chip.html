{%- assign t = site.data.i18n[page.lang] -%}
{%- case include.status -%}
{%- when "in_corso" -%}
<span class="chip chip--active"><span class="chip__dot" aria-hidden="true"></span>{{ t.status_ongoing }}</span>
{%- when "completato" -%}
<span class="chip chip--done"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>{{ t.status_done }}</span>
{%- else -%}
<span class="chip chip--archive">{{ t.status_archive }}</span>
{%- endcase -%}
