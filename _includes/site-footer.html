{%- assign t = site.data.i18n[page.lang] -%}
<footer class="site-footer">
  <div class="container site-footer__inner">
    <div class="site-footer__brand">
      <span class="brand brand--small">{{ site.title }}</span>
      <span>&copy; {{ site.time | date: '%Y' }} {{ site.author }} · {{ t.footer_built }}</span>
    </div>
    <nav class="site-footer__links" aria-label="{{ t.footer_label }}">
      <a href="{{ '/assets/CV_Tazzer.pdf' | relative_url }}">{{ t.cv }}</a>
      <a href="{{ t.prefix | append: '/feed.xml' | relative_url }}">RSS</a>
      <a href="https://github.com/enricotazzer">GitHub ↗</a>
      <a href="https://www.linkedin.com/in/enrico-tazzer-a43483340/">LinkedIn ↗</a>
    </nav>
  </div>
</footer>
