{%- assign t = site.data.i18n[page.lang] -%}
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% seo %}
{%- include translations.html %}
{%- for alt in translations %}
<link rel="alternate" hreflang="{{ alt.lang }}" href="{{ alt.url | absolute_url }}">
{%- endfor %}
{%- assign original = translations | where: "lang", site.lang | first %}
{%- if original %}
<link rel="alternate" hreflang="x-default" href="{{ original.url | absolute_url }}">
{%- endif %}
<link rel="alternate" type="application/atom+xml" href="{{ t.prefix | append: '/feed.xml' | absolute_url }}" title="{{ site.title }} ({{ t.name }})">
<link rel="icon" type="image/x-icon" href="{{ '/assets/favicon.ico' | relative_url }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&amp;display=swap">
<link rel="stylesheet" href="{{ '/css/journal.css' | relative_url }}">
<!-- Apply the saved (or OS) theme before first paint. js/scripts.js keeps the toggle in sync. -->
<script>try{var t=localStorage.getItem('darkMode');if(t==='on'||(t===null&&window.matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark-mode');}catch(e){}</script>
