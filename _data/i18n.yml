# Interface strings, one block per language. Layouts and includes read them as
# t = site.data.i18n[page.lang]; page.lang comes from the defaults in
# _config.yml (Italian everywhere, en/ and nl/ for the translations).
#
# prefix:   prepended to every internal link ("" for Italian, the source language).
# tags:     display names for post tags. The tag itself stays the key, so
#           filter links (/posts/#medicine) are the same in every language.
# Strings with {error} are filled in by JavaScript.

