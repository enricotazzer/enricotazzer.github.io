- id: sleepwatch
  title: sleepwatch
  status: in_corso
  since: "2026-09"
  short: Staging del sonno personalizzato da Apple Watch, con un agente LLM di follow-up.
  summary: >-
    Staging del sonno personalizzato e rilevazione di anomalie da frequenza cardiaca e
    accelerometro dell'Apple Watch. Dopo una notte insolita, un agente LLM fa domande aperte sulla
    giornata. Prototipo di ricerca, non un dispositivo medico.
  phase:
    done: 4
    active: 0
    total: 8
    label: 4 fasi su 8 completate
  stack: Apple Watch · GRU bidirezionale · gradient boosting · FastAPI · LLM locali
  key_result:
    value: "κ 0,510"
    text: >-
      Kappa a 5 classi della GRU bidirezionale (IC 95% 0,482–0,537; 47 soggetti, 253 notti).
      Usare le notti precedenti della stessa persona non ha migliorato lo staging.
    source: README, risultati della fase 2
  repo_pending: true
  article: pending
  en:
    short: Personalized sleep staging from the Apple Watch, with a follow-up LLM agent.
    summary: >-
      Personalized sleep staging and anomaly detection from Apple Watch heart rate and accelerometer
      data. After an unusual night, an LLM agent asks open questions about the day. A research
      prototype, not a medical device.
    stack: Apple Watch · bidirectional GRU · gradient boosting · FastAPI · local LLMs
    phase_label: 4 of 8 phases complete
    key_value: "κ 0.510"
    key_text: >-
      5-class kappa of the bidirectional GRU (95% CI 0.482–0.537; 47 subjects, 253 nights).
      Using the same person's earlier nights did not improve staging.
    key_source: README, phase 2 results
  nl:
    short: Gepersonaliseerde slaapstadiëring met de Apple Watch, met een LLM-agent voor de opvolging.
    summary: >-
      Gepersonaliseerde slaapstadiëring en detectie van afwijkingen op basis van hartslag- en
      accelerometerdata van de Apple Watch. Na een ongewone nacht stelt een LLM-agent open vragen
      over de dag. Een onderzoeksprototype, geen medisch hulpmiddel.
    stack: Apple Watch · bidirectionele GRU · gradient boosting · FastAPI · lokale LLM's
    phase_label: 4 van 8 fasen afgerond
    key_value: "κ 0,510"
    key_text: >-
      Kappa over 5 klassen van de bidirectionele GRU (95%-BI 0,482–0,537; 47 proefpersonen,
      253 nachten). Eerdere nachten van dezelfde persoon meenemen verbeterde de stadiëring niet.
    key_source: README, resultaten van fase 2

