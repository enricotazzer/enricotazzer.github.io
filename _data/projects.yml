# Projects shown on /projects/, on the home page and on each project page,
# in every language.
#
# status:     in_corso | completato | archivio
# since/until: "YYYY-MM", shown as "ago 2026 – oggi" in the page's language;
#             an empty until reads "oggi" / "today" / "nu".
# short:      one line for the home page; summary is the longer text.
# phase:      the meter: done and active (hatched) segments out of total.
#             label is shown everywhere, detail only on /projects/ and the
#             project page.
# key_result: one figure copied from the project's own README or docs, with
#             where it comes from. Never a demo or synthetic number: when the
#             real value doesn't exist yet, say so.
# repo/page/demo: links. With no repo, repo_pending: true shows
#             "Repository: in pubblicazione"; otherwise nothing is shown.
#             page is the Italian URL; the other languages prefix it (/en/...).
# article:    a post URL, or "pending" to show "Articolo: in preparazione".
#
# en / nl:    the project's text in English and Dutch. Each key overrides one
#             Italian field, and anything left out falls back to Italian:
#             title, short, summary, stack, phase_label, phase_detail,
#             key_value, key_text, key_source. Numbers stay the same; only
#             their format changes (0,510 in Italian and Dutch, 0.510 in English).

