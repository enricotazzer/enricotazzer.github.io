- id: skin-lesion-multitask
  title: Multi-Task Skin Lesion Analysis
  status: completato
  summary: >-
    Studio comparativo di due approcci alla segmentazione e classificazione congiunta di lesioni
    cutanee dermoscopiche (ISIC 2018): una CNN multitask con Cross-Fusion e una pipeline
    neuro-simbolica basata sulle regole cliniche ABCD. Con Demien Propedo ed Emanuele Pagnutti.
  stack: CNN multitask · ragionamento neuro-simbolico · ISIC 2018
  key_result:
    value: "0,9186"
    text: >-
      Dice della rete multitask in segmentazione, contro 0,9023 di DeepLabV3 (+1,6 pp). In
      classificazione costa invece 2,9 punti di accuratezza rispetto a ResNet-50.
    source: README, «TL;DR — what we found»
  repo: https://github.com/enricotazzer/multi-task-learning-for-classification-and-segmentation-of-skin-lesions
  en:
    summary: >-
      Comparative study of two approaches to joint segmentation and classification of dermoscopic
      skin lesions (ISIC 2018): a multi-task CNN with Cross-Fusion and a neuro-symbolic pipeline
      based on the clinical ABCD rules. With Demien Propedo and Emanuele Pagnutti.
    stack: multi-task CNN · neuro-symbolic reasoning · ISIC 2018
    key_value: "0.9186"
    key_text: >-
      Segmentation Dice of the multi-task network, against 0.9023 for DeepLabV3 (+1.6 pp). In
      classification, though, it costs 2.9 points of accuracy compared with ResNet-50.
    key_source: README, “TL;DR — what we found”
  nl:
    summary: >-
      Vergelijkende studie van twee benaderingen voor gecombineerde segmentatie en classificatie van
      dermoscopische huidlaesies (ISIC 2018): een multitask-CNN met Cross-Fusion en een
      neuro-symbolische pipeline op basis van de klinische ABCD-regels. Samen met Demien Propedo en
      Emanuele Pagnutti.
    stack: multitask-CNN · neuro-symbolisch redeneren · ISIC 2018
    key_value: "0,9186"
    key_text: >-
      Segmentatie-Dice van het multitasknetwerk, tegenover 0,9023 voor DeepLabV3 (+1,6 pp). Bij
      classificatie kost het daarentegen 2,9 procentpunt nauwkeurigheid ten opzichte van ResNet-50.
    key_source: README, “TL;DR — what we found”

